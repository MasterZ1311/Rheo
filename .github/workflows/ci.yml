name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - MZ-Main

jobs:
  frontend-quality:
    name: Frontend (Lint, Typecheck, Tests & Web Build)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint check with Biome
        run: bun run lint

      - name: Typecheck app + web
        run: bun run typecheck

      - name: Frontend unit tests
        run: bun run test:frontend

      - name: Build web smoke test
        run: bun run build:web

  backend-quality:
    name: Backend (Python Lint & Tests)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -r backend/requirements-test.txt

      - name: Lint check with Ruff
        run: |
          ruff check backend

      - name: Run Pytest Suite
        run: |
          python -m pytest backend/tests -v -m "not slow" --maxfail=5
