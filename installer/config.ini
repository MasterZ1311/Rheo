[Application]
Name=Rheo
DisplayName=Rheo - Sovereign Voice Studio
Description=Zero-Shot Voice Cloning, Multi-Engine Speech Synthesis, and Zero-Latency Dictation
Version=0.1.0
Author=MasterZ1311
Repository=MasterZ1311/Rheo
DefaultPort=17493
ExecutableName=Rheo.exe

[Requirements]
